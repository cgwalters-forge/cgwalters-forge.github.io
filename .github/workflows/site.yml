# Builds the site with Zola and checks its internal links on every pull
# request and push; on main, deploys it to GitHub Pages. The shape is
# agent-board's site.yml: the build job is read-only and hardened by
# secure-host, and only deploy holds the Pages grant and the OIDC
# credential deploy-pages needs, with nothing from the repository but the
# artifact build uploaded.
#
# Pages must build from "GitHub Actions" (a repository setting, build_type
# workflow). While it is the legacy branch build, deploy fails, and
# GitHub's own Jekyll build of main replaces the site with the README.
name: site

on:
  pull_request:
  push:
    branches: [main]
  # To deploy again by hand, such as after switching Pages to Actions.
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ZOLA_VERSION: 0.23.6
  # The release asset's digest as GitHub lists it.
  ZOLA_SHA256: 8f5132b3522412d04e395e0b25f6d68613ad272a873e54a2b3ebf664873024a4

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No step runs between the checkout and secure-host. Pinned by
      # commit, as in agent-board's site.yml.
      - uses: cgwalters-forge/actions/secure-host@4642b4f3a2803489a2714f5e1211371b24150fdc # main, with secure-host:v0.6.3
      - name: Install Zola
        run: |
          tarball="$RUNNER_TEMP/zola.tar.gz"
          curl -fsSL --proto '=https' -o "$tarball" \
            "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZOLA_SHA256}  ${tarball}" | sha256sum -c -
          mkdir "$RUNNER_TEMP/zola"
          tar -xzf "$tarball" -C "$RUNNER_TEMP/zola"
          echo "$RUNNER_TEMP/zola" >> "$GITHUB_PATH"
      - run: zola build
      # Internal links and anchors only: the posts link to many GitHub
      # pages, which are slow and rate-limited to check on every change.
      - run: zola check --skip-external-links
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      # Reads the Pages site (it enables nothing); deploy-pages is what
      # fails while Pages is still the legacy branch build.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
